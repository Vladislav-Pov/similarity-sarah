# Tooling configuration only (lint / type-check / test).
# Intentionally NO [project] or [build-system] table: the repo is run from a
# checkout (``python main.py ...``) and installs deps via ``requirements.txt``;
# packaging is out of scope for the rewrite.

[tool.ruff]
target-version = "py310"
line-length = 100
# Pre-rewrite hyperparameter-search backend; functional, not yet re-typed.
extend-exclude = ["similarity_sarah/runtime/search.py"]

[tool.ruff.lint]
# Conservative, high-signal rule set. Widened as the rewrite lands more modules.
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501",   # line length handled by the formatter, not enforced hard
  "B905",   # zip() strict=: loops here are over known-equal-length param lists
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true       # torch/torchvision ship partial stubs
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# The rewritten modules are checked; the older data/model/task helpers and the
# pre-rewrite search backend are functional but not yet re-typed.
follow_imports = "silent"
files = [
  "similarity_sarah/core",
  "similarity_sarah/prox",
  "similarity_sarah/algorithms",
  "similarity_sarah/experimental",
  "similarity_sarah/data/loaders.py",
  "similarity_sarah/models/__init__.py",
  "similarity_sarah/runtime/__init__.py",
  "similarity_sarah/runtime/metrics.py",
  "similarity_sarah/runtime/loop.py",
  "similarity_sarah/runtime/scheduler.py",
  "similarity_sarah/runtime/search_runner.py",
  "similarity_sarah/registry.py",
  "similarity_sarah/spec.py",
  "main.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]
