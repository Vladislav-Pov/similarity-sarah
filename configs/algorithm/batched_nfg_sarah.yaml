name: batched_nfg_sarah

num_clients: 10
batch_size_clients: 1
# Hyper-parameters below are the best Optuna-tuned values for the InexactProxSGD
# inner-loop solver (see W&B runs in tune-* groups).  Keep them as the
# default starting point; override on the command line for ablations.
theta: 0.19007937872949687
num_epochs: 100

# ── Inexact proximal solver ────────────────────────────────────────────
# ``prox_solver`` selects between SGD-with-momentum ("sgd") and Adam ("adam").
# Default is SGD with Nesterov-like Polyak momentum + small weight decay,
# which dramatically improves the inner-prox convergence on deep nets and
# is the main reason the model can reach >0.9 accuracy on CIFAR-10.
prox_solver: sgd
prox_num_steps: 86
prox_lr: 0.007299057644263543
prox_momentum: 0.0
prox_weight_decay: 0.0
# Global L2-norm clip on the inner-step direction (∇Φ).  ``0`` disables
# clipping.  Without it, a single noisy minibatch can produce a large gradient
# that SGD then amplifies into a divergence cascade (model moves into bigger-
# gradient region → next step bigger → …).  A clip threshold of ~1.0 is a
# common stability anchor: almost never fires when the prox is well-conditioned,
# kicks in exactly when it shouldn't have failed.
prox_grad_clip: 2.0
# How many fixed eval mini-batches to use for the prox-grad diagnostic
# (``prox_grad_norm_first/last``).  Increasing reduces the noise of the
# ‖∇Φ‖ estimate by 1/√eval_batches at the cost of one extra forward+backward
# per batch on each prox call (cheap relative to ``prox_num_steps``).  The
# *same* batches are reused at start and end so that ratio = last/first is
# directly comparable.  Recommended: 4-8.
prox_eval_batches: 4
# Schedule for the α coefficient in front of v inside the prox cell:
#   "constant" — α = 1 throughout (canonical prox).
#   "linear"   — α linearly decays 1 → 0 across ``prox_num_steps``;
#                early inner steps push along the SARAH direction θ·v,
#                late inner steps refine f₁ near w_outer with vanishing v.
# With "linear" the canonical-prox diagnostic ``prox_grad_norm_ratio`` may
# stay near 1 (the schedule isn't targeting the canonical optimum) — track
# ``val/accuracy`` and ``prox_obj_decrease`` instead for that mode.
prox_v_schedule: constant

# ── End-of-epoch v_tilde refresh (optional) ────────────────────────────
# Default behaviour (false): v^{(s+1)} = tilde_v_{K+1} from the recursive
# update during the epoch (literal pseudocode).
# When true: at the end of the epoch, every client computes
# ∇f_i(w_final) on ONE fresh minibatch and sends to the server, which
# also computes ∇f_1(w_final) on a server minibatch.  The carry-over is
# replaced with
#     v_epoch_new = (1/n) Σ_i ∇(f_i − f_1)(w_final),
# i.e. a single-shot stochastic anchor at the end-of-epoch iterate.
# Cost: 1 + M extra mini-batch forward+backward passes per epoch
# (cheap; same minibatch primitive as the recursive update).
update_v_tilde_in_the_end: false

# ── AccVRS-style inexact prox solvers (optional) ──────────────────────
# Set ``prox_solver`` to ``accvrs_batch_sgd`` or ``accvrs_batch_adam`` to
# use the inner-loop solver ported from AccVRS/resnet_exp/new_alg.argminA
# (Batch_SGD / Batch_Adam branches).  In this mode:
#   * ``prox_num_steps`` means *epochs* over the server loader, not inner
#     iterations (their ``argmin_max_iter``; their default ≈ 4).
#   * ``prox_lr: null`` enables auto-derive  γ₀ = (1/(2L))·prox_lr_factor,
#     where  L = 1 + θ·prox_L1.  Set an explicit value to override.
#   * ``prox_momentum`` is Polyak momentum on the inner direction.
#   * ``prox_weight_decay`` is the multiplicative shrink ``argmin_lambd``.
#   * ``prox_grad_clip`` is per-element ``torch.clamp`` (matches AccVRS),
#     NOT the global L2 clip used by the InexactProxSGD/Adam paths.
#   * ``prox_include_linear_term`` toggles the AccVRS-original behaviour
#     (false: linear ⟨θv, ·⟩ encoded only via warm-start at z = w−θv;
#     true: add θv to inner direction so SGD converges to the true argmin
#     of A^t_θ).  Default false matches their code literally.
# See docs/ACCVRS_PROX_SOLVER.md for guidance and recommended starting
# values.  Uncomment to use:
#
# prox_solver: accvrs_batch_sgd
# prox_num_steps: 4
# prox_lr: null
# prox_L1: 200.0
# prox_lr_factor: 1.0
# prox_momentum: 0.9
# prox_weight_decay: 0.1
# prox_grad_clip: 0.0
# prox_inner_decay_factor: 0.9
# prox_inner_decay_period: null     # null ⇒ len(server_loader) // 5
# prox_inner_early_stop_ratio: 0.001
# prox_include_linear_term: false
