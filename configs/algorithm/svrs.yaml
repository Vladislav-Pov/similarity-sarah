name: svrs

# Defaults are aligned with configs/algorithm/batched_nfg_sarah.yaml so the
# two algorithms can be compared head-to-head.  The prox subproblem is
# identical (server-side prox_{θ f₁}); only the construction of v differs:
# BNFG uses recursive accumulation, SVRS uses a per-epoch anchor (g_ref).
num_clients: 10
# NOTE: Algorithm 1 of Lin et al. 2023 has exactly one client per inner
# step (i_t ∼ Unif([n])).  This field is kept for API parity with BNFG /
# distributed_sarah but is forced to 1 internally; values > 1 trigger a
# warning and are ignored.
batch_size_clients: 1
theta: 0.31
num_epochs: 105

# ── Inexact proximal solver (AccVRS batch SGD) ─────────────────────────
# Same solver and hyper-parameters as BNFG so any quality difference is
# purely from the algorithmic change (recursive v vs. anchor v).
# prox_lr: null ⇒ auto γ₀ = (1/(2L))·prox_lr_factor with L = 1 + θ·prox_L1.
prox_solver: accvrs_batch_sgd
prox_num_steps: 5
prox_lr: null
prox_L1: 136.433
prox_lr_factor: 0.1346
prox_momentum: 0.9
prox_weight_decay: 0.1
prox_grad_clip: 0.0
prox_inner_decay_factor: 1.0
prox_inner_decay_period: null     # null ⇒ len(server_loader) // 5
prox_inner_early_stop_ratio: 0.001
prox_include_linear_term: false

# Number of fixed eval mini-batches for the prox-grad diagnostic (variance
# of ‖∇Φ‖ estimate shrinks as 1/√eval_batches).
prox_eval_batches: 4
# Schedule for the α coefficient in front of v inside the prox cell.
# See batched_nfg_sarah.yaml for the explanation.
prox_v_schedule: linear
