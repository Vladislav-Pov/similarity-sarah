name: distributed_sarah

# Distributed NoFullGrad SARAH baseline (Medyakov-style): plain SARAH with a
# running-mean carry-over anchor (never a full gradient) and a plain gradient
# step (no f1 prox). Communication-matched to NFG-SS — same two-gradient SARAH
# footprint per inner step — so the gap isolates the value of the f1-proximal
# step under second-order similarity.
#
# Defaults aligned with batched_nfg_sarah.yaml so the two compare head-to-head:
# same num_clients, B = 1 (K = num_clients = 10 inner steps per epoch), same
# epoch budget. Data loaders, server fraction (configs/partition/uniform.yaml),
# val split etc. are inherited globally.
num_clients: 10
batch_size_clients: 1
lr: 0.01
weight_decay: 0.0          # tuned in search (1e-6 … 1e-3)
num_epochs: 150

# Heavy-ball momentum on the SARAH direction v_t:
#   m_t = momentum * m_{t-1} + v_t ;  w_{t+1} = w_t - lr*(m_t + wd*w_t).
# Buffer persists across epochs. 0.0 = plain step (literal Medyakov). Near-
# essential for ResNet/CIFAR — without it the baseline severely underfits.
momentum: 0.0

# Step-size schedule for the plain SARAH step:
#   constant — fixed lr (the literal Medyakov transplant).
#   cosine   — lr cosine-anneals from `lr` (epoch 0) to `lr * lr_min_factor`
#              (last epoch). Stabilises long-horizon runs (kills the late
#              val-loss spikes a constant step produces at 150+ epochs).
lr_schedule: cosine
lr_min_factor: 0.0         # final lr = lr * lr_min_factor (cosine only)
# Cosine horizon (T_max). null ⇒ num_epochs. When tuning at a SHORT num_epochs
# but targeting a LONG final run, set this to the final length (e.g. 500) so the
# tune's lr trajectory matches the long run's first epochs.
lr_t_max: null

# Server f1 is queried every inner step (weight 1/n) so the estimator targets
# the same f = 1/n · Σ_i f_i that NFG-SS minimises. False ⇒ client-only average
# (a different, unfair objective — keep True for head-to-head comparison).
include_server: true

# Train augmentation on the node gradient loaders is a data-level flag —
# enable with `data.augment_train=true` (RandomCrop+HFlip on CIFAR-10; safe for
# the SARAH telescope, see configs/data/cifar10.yaml).
