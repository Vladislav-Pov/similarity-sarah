# Best-known NFG-SS configuration (CIFAR-10 / ResNet-18 / 11 nodes).
#
# The winning formula from the May-2026 grid searches; see
# docs/reference_runs/ for the snapshots this reproduces. Run with:
#
#     python main.py algorithm=best seed=0
#
name: nfg_ss

theta: 0.2
num_epochs: 50
num_clients: 10
batch_size_clients: 1

# ── Inexact proximal solver: AccVRS Batch-SGD (the best-known inner solver) ──
prox_solver: accvrs_batch_sgd
# Auto-derived inner LR: gamma0 = (1 / (2L)) * prox_lr_factor, L = 1 + theta*prox_L1.
# With theta=0.2, prox_L1=200, prox_lr_factor=0.1  =>  gamma0 ~= 1.22e-3.
prox_lr: null
prox_L1: 200
prox_lr_factor: 0.1
# num_steps counts full passes over the server loader (not iterations).
prox_num_steps: 4
prox_momentum: 0.9
prox_weight_decay: 0.1
prox_grad_clip: 0
prox_eval_batches: 4
prox_inner_decay_factor: 1
prox_inner_decay_period: null
# Canonical AccVRS: v enters only via the warm-start z = w - theta*v.
prox_include_linear_term: false
prox_inner_early_stop_ratio: 0.0001

# NOTE: prox_v_schedule is a NO-OP on the AccVRS path (the solver encodes v
# solely through the warm-start), so "constant" and "linear" are identical
# here. The field is kept for parity with the sgd/adam solvers, where it does
# take effect. Set prox_num_steps: 5 for the linear_5steps reference variant.
prox_v_schedule: constant
