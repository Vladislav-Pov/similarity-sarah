name: cifar10
data_dir: ./data
val_fraction: 0.1
# Apply RandomCrop+HorizontalFlip on the server's *prox* loader only.
# The server's *gradient* loader (used inside the SARAH recursion) and
# all client loaders stay deterministic — the SARAH difference
# ∇(f_i−f_1)(w_t) − ∇(f_i−f_1)(w_{t-1}) requires the same ∇f to be
# well-defined at both iterates.  Augmentation inside the prox SGD/Adam
# loop is harmless (the inner loop is already stochastic w.r.t. the
# minibatch) and significantly improves CIFAR-10 generalisation.
augment_server: true
