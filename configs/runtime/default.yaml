device: auto
eval_every: 1
log_every: 1
num_workers: 6

# Two canonical batch sizes used by the training loaders:
#   * ``batch_size``       — small minibatch for noisy/inner training (prox SGD).
#   * ``large_batch_size`` — large minibatch for low-variance gradient
#                            estimates that feed the SARAH recursion.
batch_size: 512
# Kept equal to ``batch_size`` by default so a single edit drives every loader;
# override with an explicit value to decouple the large-batch loaders.
large_batch_size: ${.batch_size}

# Server — *gradient* loader used inside the SARAH recursion (∇f₁ at w_t/w_{t-1}).
# Must be deterministic (no augmentation): the same minibatch is reused at the two
# iterates within one inner step, so a larger batch directly reduces estimator variance.
batch_size_server_grad: ${.large_batch_size}
# Server — *prox* loader used inside the inexact proximal solver (stochastic training
# on f₁).  Augmentation is allowed here (see ``data.augment_server``); a smaller batch
# keeps the inner loop fast.
batch_size_server_prox: ${.batch_size}
# Client partitions: minibatch for each client's local DataLoader.  Also feeds the
# SARAH recursion (one batch per client per inner step, reused at w_t and w_{t-1}),
# so we pick the large size to suppress estimator variance.
batch_size_data_clients: ${.large_batch_size}

# ── Optional learning-rate schedule for the inexact prox solver ──────
# Multiplies ``prox_lr`` (and only ``prox_lr``) by a per-epoch factor.
# Disabled by default.  Available kinds: "constant", "cosine", "step".
prox_lr_schedule:
  kind: constant
  # cosine:        lr_t = max_lr * 0.5 * (1 + cos(pi * t / T_max))
  t_max: ${algorithm.num_epochs}
  min_factor: 0.01
  # step:          lr_t = max_lr * gamma^(t // step_every)
  step_every: 30
  gamma: 0.1

# ── Checkpointing ────────────────────────────────────────────────────
# Set ``checkpoint_dir`` to a path to enable checkpoint saving.
# Two files are written per training run:
#   <checkpoint_dir>/<prefix>_best.pt   — best val-accuracy weights
#   <checkpoint_dir>/<prefix>_final.pt  — weights at the end of training
# The prefix is the algorithm name in standalone runs and
# ``trial_<id>_<algo>`` in search runs.
checkpoint_dir: null
# Set to a .pt file path to warm-start the model from saved weights
# before training begins (works in both standalone and search modes).
init_from_checkpoint: null
# Also restore v_epoch (SARAH carry-over) from the checkpoint.
# Avoids the epoch-2 divergence that occurs when v_epoch starts from zero
# while the model is already in a good region (0.8+ accuracy).
# If theta changed between runs, v_epoch is rescaled automatically so the
# warm-start shift z = w_outer - theta*v keeps the same magnitude.
# Only takes effect when init_from_checkpoint is set.
load_v_epoch: false

wandb:
  enabled: true
  project: amir_debug
  entity: chirkov
  group: null
  tags: []
  job_type: null
  name: null
