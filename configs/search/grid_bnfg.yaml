enabled: true
method: grid
max_epochs: 100
num_trials: 200        # safety cap (теперь комбинаций больше)
wandb_project: similarity-sarah
wandb_group: "bnfg-grid-${now:%Y%m%d-%H%M%S}"

shared:
  batch_size_clients: [1, 2, 5]

batched_nfg_sarah:
  theta:          [0.1, 0.2, 0.5, 1.0]
  prox_lr:        [0.005, 0.012]
  prox_num_steps: [80, 120]
  prox_v_schedule: [constant, linear]