# Grid search for batched_nfg_sarah only.
# Total trials = product of all list lengths.  With current ranges that's
# 4 × 3 = 12 trials.
enabled: true
method: grid
max_epochs: 30
num_trials: 100        # safety cap
wandb_project: similarity-sarah
wandb_group: "bnfg-grid-${now:%Y%m%d-%H%M%S}"

shared:
  batch_size_clients: [1]

batched_nfg_sarah:
  theta:          [0.1, 0.2, 0.5, 1.0]
  prox_lr:        [0.005, 0.012]
  prox_num_steps: [80]
  prox_v_schedule: [constant, linear]
