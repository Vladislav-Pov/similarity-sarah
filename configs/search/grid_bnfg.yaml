enabled: true
method: grid
max_epochs: 100
num_trials: 200        # safety cap (теперь комбинаций больше)
wandb_project: similarity-sarah
wandb_group: "bnfg-grid-${now:%Y%m%d-%H%M%S}"

shared:
  batch_size_clients: [1]

batched_nfg_sarah:
  theta: [0.2]
  prox_solver: [accvrs_batch_sgd]
  prox_num_steps: [4]
  prox_lr: [null]
  prox_L1: [200.0]
  prox_lr_factor: [0.1]
  prox_momentum: [0.9]
  prox_weight_decay: [0.1]
  prox_grad_clip: [0.0]
  prox_eval_batches: [4]
  prox_v_schedule: [linear]
  prox_inner_decay_factor: [1.0]
  prox_inner_decay_period: [null]
  prox_inner_early_stop_ratio: [0.0001]
  prox_include_linear_term: [false]
