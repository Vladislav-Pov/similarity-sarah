# Grid sweep of nfg_sarah (batched_nfg_sarah) over:
#   * Dirichlet non-IID heterogeneity  alpha_dirichlet ∈ {0.5, 1, 10}
#   * clients sampled per inner step   batch_size_clients (B) ∈ {1, 2, 5}
# => 3 × 3 = 9 trials.
#
# Requires the Dirichlet partition, so launch with `partition=dirichlet`:
#
#   python main.py \
#     algorithm=batched_nfg_sarah \
#     partition=dirichlet \
#     search=grid_dirichlet_bnfg
#
# The `partition.alpha` sweep re-partitions the data per trial (the runner
# detects `partition.*` params and rebuilds the client loaders).
enabled: true
method: grid
max_epochs: 35
num_trials: 100        # safety cap (> 9 combinations)
wandb_project: similarity-sarah
wandb_group: "bnfg-dirichlet-grid-${now:%Y%m%d-%H%M%S}"

# Swept over the Dirichlet partition (only meaningful with partition=dirichlet).
partition:
  alpha: [0.5, 1.0, 10.0]

shared:
  batch_size_clients: [1, 2, 5]

batched_nfg_sarah:
  theta: [0.2]
  prox_solver: [accvrs_batch_sgd]
  prox_num_steps: [4]
  prox_lr: [null]
  prox_L1: [200.0]
  prox_lr_factor: [0.1]
  prox_momentum: [0.9]
  prox_weight_decay: [0.1]
  prox_grad_clip: [0.0]
  prox_eval_batches: [4]
  prox_v_schedule: [linear]
  prox_inner_decay_factor: [1.0]
  prox_inner_decay_period: [null]
  prox_inner_early_stop_ratio: [0.0001]
  prox_include_linear_term: [false]
