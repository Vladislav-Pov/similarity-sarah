# Independent Optuna study PER GLUE TASK for the SVRS baseline.
# Task fixed per run (set data.task on the CLI); see optuna_glue_bnfg.yaml
# for the rationale and scripts/tune_glue.sh for the task/method loop.
#
#   python main.py +experiment=glue_roberta_lora data.task=rte search=optuna_glue_svrs
enabled: true
method: optuna
max_epochs: 20
num_trials: 30
wandb_project: glue-tune
wandb_group: "glue-svrs-${data.task}-${now:%Y%m%d-%H%M%S}"

storage_dir: optuna_studies
study_name: "glue-svrs-${data.task}"

sampler:
  kind: tpe
  seed: 0
pruner:
  kind: median
  n_startup_trials: 6
  n_warmup_epochs: 5
  interval_epochs: 1

shared:
  num_epochs:
    type: int
    low: 5
    high: 20

# SVRS uses the plain "sgd" prox solver ⇒ tune prox_lr directly.
svrs:
  theta:
    type: float
    low: 0.1
    high: 1.0
    log: true
  prox_lr:
    type: float
    low: 1.0e-4
    high: 5.0e-2
    log: true
  prox_num_steps:
    type: int
    low: 40
    high: 100
