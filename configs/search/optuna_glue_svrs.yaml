# Independent Optuna study PER GLUE TASK for the SVRS baseline.
# Task fixed per run (set data.task on the CLI); see optuna_glue_bnfg.yaml
# for the rationale and scripts/tune_glue_task.sh for the per-task loop.
#
#   python main.py +experiment=glue_roberta_lora data.task=rte search=optuna_glue_svrs
#
# SVRS now uses the SAME AccVRS batch-SGD prox solver as BNFG (prox_lr=null,
# auto γ₀ from prox_lr_factor & prox_L1), so the search space mirrors
# optuna_glue_bnfg.yaml exactly — only the v construction differs between the
# two methods, keeping the comparison apples-to-apples.
enabled: true
method: optuna
max_epochs: 20
num_trials: 30
wandb_project: glue-tune
wandb_group: "glue-svrs-${data.task}-${now:%Y%m%d-%H%M%S}"

storage_dir: optuna_studies
study_name: "glue-svrs-${data.task}"

sampler:
  kind: tpe
  seed: 0
pruner:
  kind: median
  n_startup_trials: 6
  n_warmup_epochs: 5
  interval_epochs: 1

# Epochs tuned per task too (small tasks like RTE/MRPC need more passes).
shared:
  num_epochs:
    type: int
    low: 5
    high: 20

# AccVRS batch-SGD solver ⇒ tune the same knobs as BNFG.
svrs:
  theta:
    type: float
    low: 0.05
    high: 1.0
    log: true
  prox_lr_factor:
    type: float
    low: 0.02
    high: 0.5
    log: true
  prox_num_steps:
    type: int
    low: 3
    high: 8
  # Smoothness constant in L = 1 + θ·prox_L1 that sets the auto γ₀; anchored
  # around the tuned ~136 / default 200.
  prox_L1:
    type: float
    low: 50.0
    high: 400.0
    log: true
