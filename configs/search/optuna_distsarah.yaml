# Optuna search for distributed_sarah — SHORT proxy tune (150 epochs) for a
# 500-epoch final run. Cosine is calibrated to the final horizon (lr_t_max=500,
# fixed) so each trial sees the first 150 epochs of the real 500-schedule.
# Tunes lr (continuous, log) + momentum; weight_decay fixed at 1e-4 (it barely
# shows at the underfit short horizon — re-check it on the 500-run). TPE +
# median pruner. NOTE: trials do NOT log per-trial to W&B (search_runner uses a
# no-op logger); read the best from the Optuna study.
enabled: true
method: optuna
max_epochs: 150
num_trials: 50
wandb_project: distributed-sarah
wandb_group: "dist-optuna-${now:%Y%m%d-%H%M%S}"

# Persistent SQLite storage; see optuna_bnfg.yaml for details.
storage_dir: nfg_optuna
study_name: null

sampler:
  kind: tpe
  seed: 0

pruner:
  kind: median
  n_startup_trials: 10
  n_warmup_epochs: 50      # 150-epoch horizon: don't prune before cosine kicks in
  interval_epochs: 1

shared:
  batch_size_clients:
    type: categorical
    choices: [1]

distributed_sarah:
  lr:
    type: float
    low: 1.0e-4
    high: 5.0e-2
    log: true
  momentum:
    type: categorical
    choices: [0.9, 0.95, 0.99]
  weight_decay: 
    type: float
    low: 1.0e-6
    high: 1.0e-3
    log: true
  lr_t_max: 500            # fixed: cosine calibrated to the 500-epoch final run
