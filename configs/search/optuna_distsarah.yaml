# Optuna search for distributed_sarah only.  Log-uniform sweep over the two
# knobs — lr (step size) and weight_decay — with TPE + median pruner.
enabled: true
method: optuna
max_epochs: 50
num_trials: 50
wandb_project: distributed-sarah
wandb_group: "dist-optuna-${now:%Y%m%d-%H%M%S}"

# Persistent SQLite storage; see optuna_bnfg.yaml for details.
storage_dir: nfg_optuna
study_name: null

sampler:
  kind: tpe
  seed: 0

pruner:
  kind: median
  n_startup_trials: 5
  n_warmup_epochs: 20
  interval_epochs: 1

shared:
  batch_size_clients:
    type: categorical
    choices: [1]

distributed_sarah:
  lr:
    type: float
    low: 1.0e-4
    high: 1.0
    log: true
  weight_decay:
    type: float
    low: 1.0e-6
    high: 1.0e-3
    log: true
