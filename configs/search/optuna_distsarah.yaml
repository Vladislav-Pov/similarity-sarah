# Optuna search for distributed_sarah only.  Just a log-uniform sweep
# over lr — TPE on a single dimension reduces to random search but still
# benefits from the median pruner.
enabled: true
method: optuna
max_epochs: 50
num_trials: 12
wandb_project: similarity-sarah
wandb_group: "dist-optuna-${now:%Y%m%d-%H%M%S}"

sampler:
  kind: tpe
  seed: 0

pruner:
  kind: median
  n_startup_trials: 3
  n_warmup_epochs: 5
  interval_epochs: 1

shared:
  batch_size_clients:
    type: categorical
    choices: [1]

distributed_sarah:
  lr:
    type: float
    low: 1.0e-3
    high: 1.0
    log: true
