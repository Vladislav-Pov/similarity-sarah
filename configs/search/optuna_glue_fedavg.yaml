# Independent Optuna study PER GLUE TASK for the FedAvg baseline.
# Task fixed per run (set data.task on the CLI); see optuna_glue_bnfg.yaml
# for the rationale and scripts/tune_glue.sh for the task/method loop.
#
#   python main.py +experiment=glue_roberta_lora data.task=rte search=optuna_glue_fedavg
enabled: true
method: optuna
max_epochs: 20
num_trials: 20
wandb_project: glue-tune
wandb_group: "glue-fedavg-${data.task}-${now:%Y%m%d-%H%M%S}"

storage_dir: optuna_studies
study_name: "glue-fedavg-${data.task}"

sampler:
  kind: tpe
  seed: 0
pruner:
  kind: median
  n_startup_trials: 4
  n_warmup_epochs: 5
  interval_epochs: 1

shared:
  num_epochs:
    type: int
    low: 5
    high: 20

fedavg:
  lr:
    type: float
    low: 1.0e-4
    high: 1.0e-1
    log: true
