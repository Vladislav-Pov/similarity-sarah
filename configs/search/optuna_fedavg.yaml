# Optuna search for "unfair" FedAvg only (single-gradient version).
enabled: true
method: optuna
max_epochs: 50
num_trials: 12
wandb_project: similarity-sarah
wandb_group: "fedavg-optuna-${now:%Y%m%d-%H%M%S}"

storage_dir: optuna_studies
study_name: null

sampler:
  kind: tpe
  seed: 0

pruner:
  kind: median
  n_startup_trials: 3
  n_warmup_epochs: 5
  interval_epochs: 1

shared:
  batch_size_clients:
    type: categorical
    choices: [1]

fedavg:
  lr:
    type: float
    low: 1.0e-3
    high: 1.0
    log: true
