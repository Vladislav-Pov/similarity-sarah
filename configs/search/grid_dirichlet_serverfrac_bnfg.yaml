# Grid sweep of nfg_sarah (batched_nfg_sarah) over the DATA SPLIT:
#   * Dirichlet non-IID heterogeneity  alpha           ∈ {0.5, 1, 10}
#   * IID share of data kept by server  server_fraction ∈ {0.1, 0.3, 0.5}
#     (clients get the rest: 1 - server_fraction)
# => 3 × 3 = 9 trials.  Batch sizes are FIXED (not swept): the client
# minibatch stays at runtime.batch_size and B at the algorithm default.
#
# Requires the Dirichlet partition, so launch with `partition=dirichlet`:
#
#   python main.py \
#     algorithm=batched_nfg_sarah \
#     partition=dirichlet \
#     search=grid_dirichlet_serverfrac_bnfg
#
# Both swept params live on the partition, so the runner re-partitions the
# data per trial (it detects `partition.*` params and rebuilds the loaders).
enabled: true
method: grid
max_epochs: 35
num_trials: 100        # safety cap (> 9 combinations)
wandb_project: similarity-sarah
wandb_group: "bnfg-dirichlet-serverfrac-grid-${now:%Y%m%d-%H%M%S}"

# Swept over the Dirichlet partition (only meaningful with partition=dirichlet).
partition:
  alpha: [0.5, 1.0, 10.0]
  server_fraction: [0.1, 0.3, 0.5]

# Batch size fixed: no `shared.batch_size_clients` axis here, so B stays at the
# batched_nfg_sarah default (1) and the data minibatch stays at runtime.batch_size.
batched_nfg_sarah:
  theta: [0.2]
  prox_solver: [accvrs_batch_sgd]
  prox_num_steps: [4]
  prox_lr: [null]
  prox_L1: [200.0]
  prox_lr_factor: [0.1]
  prox_momentum: [0.9]
  prox_weight_decay: [0.1]
  prox_grad_clip: [0.0]
  prox_eval_batches: [4]
  prox_v_schedule: [linear]
  prox_inner_decay_factor: [1.0]
  prox_inner_decay_period: [null]
  prox_inner_early_stop_ratio: [0.0001]
  prox_include_linear_term: [false]
