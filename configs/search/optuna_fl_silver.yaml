# Optuna GRID search for FL-SILVER only (no other algorithm block ⇒ only
# fl_silver is trained per trial).
#
# ``sampler.kind: grid`` uses Optuna's GridSampler: it enumerates the FULL
# Cartesian product of the categorical choices below — exactly a grid sweep —
# with no duplicate configs, while still benefiting from the median pruner.
#
# Grid size = lr(4) × num_local_steps(3) × num_refresh_clients(3) = 36.
# Set ``num_trials`` = 36 to cover the whole grid (fewer ⇒ partial grid;
# the walk order is seeded/shuffled so a partial run still spreads out).
#
# RUN:
#   python main.py search=optuna_fl_silver \
#       runtime.checkpoint_dir=checkpoints/fls_sweep \
#       search.study_name=fls-grid-1
#
# Resumable: re-launch with the SAME search.study_name to continue the sweep.
enabled: true
method: optuna
max_epochs: 30        # triage budget: ranks configs, not converges them
num_trials: 36        # = |grid|
wandb_project: fl-silver
wandb_group: "fl-silver-grid-${now:%Y%m%d-%H%M%S}"

# Persistent SQLite study. Set a stable name to RESUME the same sweep.
storage_dir: optuna_studies
study_name: null

# GridSampler ⇒ deterministic full-grid enumeration.
sampler:
  kind: grid
  seed: 0

# Median pruner: kill below-median configs after a warmup so the grid spends
# its budget on the promising region.  Pruned grid points still count as
# visited, so the sweep never re-runs them.
pruner:
  kind: median
  n_startup_trials: 8
  n_warmup_epochs: 10
  interval_epochs: 1

# NOTE: no batched_nfg_sarah / svrs / distributed_sarah / fedavg blocks ⇒
# those algorithms are skipped; each trial trains fl_silver only.
fl_silver:
  # ── The 3 knobs that actually drive FL-SILVER (see algorithm docstring) ──
  # η — local step size.  MOST critical: there is no prox to stabilise, so the
  # effective per-round move ≈ lr·num_local_steps.  Log-spaced.
  lr:
    type: categorical
    choices: [0.005, 0.01, 0.02, 0.05]
  # K — local variance-reduced steps per round.  Couples with lr (keep lr·K
  # roughly constant); larger K ⇒ more client drift under heterogeneity.
  num_local_steps:
    type: categorical
    choices: [3, 5, 10]
  # p — client memories refreshed per round (|I^t|).  Larger p ⇒ fresher
  # memory table & better g_bar, but costlier; small p leans on similarity.
  num_refresh_clients:
    type: categorical
    choices: [2, 3, 5]

  # ── Pinned (not swept) — kept explicit for a reproducible grid ──────────
  # Rounds per epoch: budget/eval-frequency knob, not a learning param.
  rounds_per_epoch:
    type: categorical
    choices: [10]
  # Anchor variance and the Langevin term stay fixed for the optimizer sweep.
  anchor_batches:
    type: categorical
    choices: [2]
  noise_std:
    type: categorical
    choices: [0.0]
