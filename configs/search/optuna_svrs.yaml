# Optuna search for SVRS only (no batched_nfg_sarah block ⇒ BNFG is NOT
# trained, each trial runs SVRS only).
#
# All parameters are categorical with explicit value lists, so Optuna
# enumerates exactly the grid below (5 × 5 × 1 × 2 = 50 combinations)
# while still benefiting from the median pruner.  Set num_trials ≥ 50
# to cover the full grid; smaller values let TPE pick a subset.
enabled: true
method: optuna
max_epochs: 100
num_trials: 50
wandb_project: svrs
wandb_group: "svrs-optuna-${now:%Y%m%d-%H%M%S}"

# Persistent SQLite storage; see optuna_bnfg.yaml for details.
storage_dir: optuna_studies
study_name: null

sampler:
  kind: tpe
  seed: 0

# Aggressive pruning: kill below-median trials after 5 warmup epochs.
pruner:
  kind: median
  n_startup_trials: 10
  n_warmup_epochs: 20
  interval_epochs: 1

shared:
  batch_size_clients:
    type: categorical
    choices: [1]

# NOTE: no `batched_nfg_sarah:` block ⇒ BNFG is skipped.
svrs:
  theta:
    type: categorical
    choices: [0.1, 0.2, 0.4, 0.5, 1.0]
  prox_lr:
    type: categorical
    choices: [0.0005, 0.001, 0.005, 0.012, 0.02]
  prox_num_steps:
    type: categorical
    choices: [80]
  prox_v_schedule:
    type: categorical
    choices: [constant, linear]