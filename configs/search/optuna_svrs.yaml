# Optuna search for SVRS only (no batched_nfg_sarah block ⇒ BNFG is NOT
# trained, each trial runs SVRS only).
#
# Search ranges are anchored around BNFG's best-known config (theta=0.2-0.5,
# prox_lr=0.005-0.012, prox_num_steps=80-160, prox_grad_clip=2.0).  Since
# the prox subproblem is identical between BNFG and SVRS, the prox knobs
# transfer directly; only theta might want a slightly different value.
enabled: true
method: optuna
max_epochs: 30
num_trials: 12
wandb_project: similarity-sarah
wandb_group: "svrs-optuna-${now:%Y%m%d-%H%M%S}"

# Persistent SQLite storage; see optuna_bnfg.yaml for details.
storage_dir: optuna_studies
study_name: null

sampler:
  kind: tpe
  seed: 0

# Aggressive pruning: kill below-median trials after 5 warmup epochs.
pruner:
  kind: median
  n_startup_trials: 3
  n_warmup_epochs: 5
  interval_epochs: 1

shared:
  batch_size_clients:
    type: categorical
    choices: [1]

# NOTE: no `batched_nfg_sarah:` block ⇒ BNFG is skipped.
svrs:
  theta:
    type: float
    low: 0.1
    high: 1.0
    log: true
  prox_lr:
    type: float
    low: 2.0e-3
    high: 1.5e-2
    log: true
  prox_num_steps:
    type: int
    low: 50
    high: 160
    log: true
