# Optuna search for batched_nfg_sarah only.
# Search ranges anchored around the current best (theta=0.2-0.5, prox_lr=0.005,
# prox_num_steps=80, prox_grad_clip=2.0, prox_v_schedule=constant).
enabled: true
method: optuna
max_epochs: 30
num_trials: 12
wandb_project: similarity-sarah
wandb_group: "bnfg-optuna-${now:%Y%m%d-%H%M%S}"

# Persistent storage for the Optuna study (SQLite).  Path is
# <storage_dir>/<study_name>.db, anchored at the repo root.
# Set ``storage_dir: null`` to keep the study in memory only.
# Set ``study_name`` to a stable string if you want to RESUME a sweep
# after a crash; otherwise it defaults to ``wandb_group`` (which has a
# timestamp ⇒ a fresh DB per launch).
storage_dir: optuna_studies
study_name: null

sampler:
  kind: tpe
  seed: 0

pruner:
  kind: median
  n_startup_trials: 3
  n_warmup_epochs: 5
  interval_epochs: 1

shared:
  batch_size_clients:
    type: categorical
    choices: [1]

batched_nfg_sarah:
  theta:
    type: float
    low: 0.1
    high: 1.0
    log: true
  prox_lr:
    type: float
    low: 2.0e-3
    high: 1.5e-2
    log: true
  prox_num_steps:
    type: int
    low: 50
    high: 160
    log: true
