# Optuna search for distributed_sarah_local_steps only.
# Same ranges as optuna_bnfg (theta, prox_lr, prox_num_steps).
enabled: true
method: optuna
max_epochs: 100
num_trials: 100
wandb_project: sarah-nofullgrad-baseline-optuna
wandb_group: "distlocal-optuna-${now:%Y%m%d-%H%M%S}"

storage_dir: optuna_studies
study_name: null

sampler:
  kind: tpe
  seed: 0

pruner:
  kind: median
  n_startup_trials: 10
  n_warmup_epochs: 20
  interval_epochs: 1

shared:
  batch_size_clients:
    type: categorical
    choices: [1, 2, 5]

distributed_sarah_local_steps:
  theta:
    type: float
    low: 0.1
    high: 1.0
    log: true
  prox_lr:
    type: float
    low: 1.0e-4
    high: 1.5e-2
    log: true
  prox_num_steps:
    type: int
    low: 80
    high: 120
    log: true
