# @package _global_
defaults:
  - override /algorithm: batched_nfg_sarah
  - override /data: cifar10
  - override /model: simple_cnn
  - override /partition: uniform
  - override /runtime: default

seed: 42

algorithm:
  num_clients: 4
  batch_size_clients: 2
  theta: 0.01
  prox_num_steps: 3
  prox_lr: 0.01
  prox_momentum: 0.0
  prox_weight_decay: 0.0
  num_epochs: 2

data:
  augment_server: false

runtime:
  device: cpu
  num_workers: 0
  batch_size: 32
