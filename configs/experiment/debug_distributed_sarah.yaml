# @package _global_
defaults:
  - override /algorithm: distributed_sarah
  - override /data: cifar10
  - override /model: simple_cnn
  - override /partition: uniform
  - override /runtime: default

seed: 42

algorithm:
  num_clients: 4
  batch_size_clients: 2
  lr: 0.01
  num_epochs: 2

runtime:
  device: cpu
  num_workers: 0
  batch_size: 32
