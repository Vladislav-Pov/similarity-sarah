name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install hydra-core omegaconf numpy ruff mypy pytest

      # Lint scope widens as the rewrite lands more modules.
      - name: Lint (ruff)
        run: |
          ruff check \
            similarity_sarah/core \
            similarity_sarah/prox \
            similarity_sarah/algorithms/__init__.py \
            similarity_sarah/algorithms/base.py \
            similarity_sarah/algorithms/nfg_ss.py \
            similarity_sarah/algorithms/svrs.py \
            similarity_sarah/algorithms/fedavg.py \
            similarity_sarah/data/loaders.py \
            similarity_sarah/models/__init__.py \
            similarity_sarah/runtime/metrics.py \
            similarity_sarah/runtime/loop.py \
            similarity_sarah/registry.py \
            similarity_sarah/spec.py \
            similarity_sarah/experimental \
            main.py \
            tests \
            scripts/capture_golden.py

      # Type-check scope is configured in pyproject ([tool.mypy] files).
      - name: Type-check (mypy)
        run: mypy

      - name: Tests
        run: pytest
